<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خودشناسی | Self Insight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --indigo:#2E2A63; --indigo-2:#241F52; --gold:#C9A15E; --teal:#2F8F82; --rose:#C7627A;
  --lav-50:#FAF9FE; --lav-100:#F1EFFB; --lav-200:#E4E0F6; --ink:#221F3D; --ink-60:#5C5A78;
  --white:#FFFFFF; --danger:#C4483F; --ok:#2F8F5E;
  --dim-r:#C4483F; --dim-b:#433DAE; --dim-y:#B8873F; --dim-w:#217A6E;
  --r-sm:10px; --r-md:16px; --r-lg:24px; --r-xl:32px;
  --shadow-1: 0 1px 2px rgba(34,31,61,.06), 0 8px 24px rgba(34,31,61,.08);
  --shadow-2: 0 4px 12px rgba(34,31,61,.10), 0 20px 48px rgba(34,31,61,.14);
  --font-fa:'Vazirmatn',sans-serif; --font-en:'Inter',sans-serif;
}
:root[data-theme="dark"]{
  --indigo:#5457B0; --indigo-2:#7B7EE8; --gold:#E0BD7E; --teal:#45C2B1; --rose:#E08BA3;
  --lav-50:#0C0E27; --lav-100:#141833; --lav-200:#262B54; --ink:#EDEDFA; --ink-60:#B7BAE0;
  --white:#161A3E; --danger:#E88079; --ok:#5FD79B;
  --dim-r:#F0897F; --dim-b:#9A9DF2; --dim-y:#EFC989; --dim-w:#5FD1C0;
  --shadow-1: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  --shadow-2: 0 4px 16px rgba(0,0,0,.4), 0 24px 56px rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;min-height:100vh;}
body{
  background:radial-gradient(1200px 800px at 15% -10%, #EDE9FB 0%, transparent 60%),
             radial-gradient(1000px 700px at 110% 10%, #E8F3F0 0%, transparent 55%),
             var(--lav-50);
  color:var(--ink); font-family:var(--font-fa); -webkit-font-smoothing:antialiased;
  min-height:100vh; display:flex; flex-direction:column; transition:background-color .3s,color .3s;
}
:root[data-theme="dark"] body{
  background:radial-gradient(1200px 800px at 15% -10%, rgba(84,87,176,.28) 0%, transparent 60%),
             radial-gradient(1000px 700px at 110% 10%, rgba(69,194,177,.20) 0%, transparent 55%),
             var(--lav-50);
}
body.lang-en{font-family:var(--font-en);}
::selection{background:var(--gold); color:var(--indigo-2);}
a{color:inherit;}
button{font-family:inherit;}
.hidden{display:none !important;}
svg.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;}

/* ---------- shell ---------- */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 24px; position:sticky; top:0; z-index:40;
  background:rgba(250,249,254,.75); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(34,31,61,.06); transition:.3s;
}
:root[data-theme="dark"] .topbar{ background:rgba(12,14,39,.72); border-bottom-color:rgba(255,255,255,.06); }
.brand{display:flex; align-items:center; gap:10px; font-weight:800; font-size:18px; color:var(--indigo-2);}
.brand .mark{width:30px;height:30px;border-radius:9px;background:conic-gradient(from 220deg,var(--indigo),var(--teal),var(--gold),var(--rose),var(--indigo));}
.topbar-actions{display:flex;gap:8px;align-items:center;}
.chip-btn{
  border:1px solid var(--lav-200); background:var(--white); color:var(--ink);
  padding:8px 14px; border-radius:999px; font-size:13px; font-weight:600; cursor:pointer;
  transition:.15s; display:flex; gap:6px; align-items:center;
}
.chip-btn:hover{border-color:var(--gold); color:var(--indigo-2);}
.chip-btn.active{background:var(--indigo); color:#fff; border-color:var(--indigo);}
.icon-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--lav-200); background:var(--white); color:var(--ink-60); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:.15s;}
.icon-btn:hover{border-color:var(--gold); color:var(--indigo-2);}

main{flex:1; display:flex; justify-content:center; padding:32px 16px 40px;}
.screen{width:100%; max-width:520px; animation:rise .45s cubic-bezier(.2,.8,.2,1);}
.screen.wide{max-width:880px;}
@keyframes rise{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);}}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001s !important; transition-duration:.001s !important;} }

.card{
  background:rgba(255,255,255,.82); border:1px solid rgba(255,255,255,.6);
  border-radius:var(--r-xl); padding:32px; box-shadow:var(--shadow-1);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); transition:background-color .3s, border-color .3s;
}
:root[data-theme="dark"] .card{ background:rgba(22,26,62,.78); border-color:rgba(255,255,255,.08); }
h1{font-size:26px; margin:0 0 6px; font-weight:800; color:var(--indigo-2); line-height:1.4;}
h2{font-size:20px; margin:0 0 4px; font-weight:800; color:var(--indigo-2); display:flex; align-items:center; gap:8px;}
p.sub{color:var(--ink-60); margin:0 0 24px; font-size:14.5px; line-height:1.9;}
label{display:block; font-size:13px; font-weight:600; color:var(--ink-60); margin:0 0 6px;}
.field{margin-bottom:16px;}
input[type=text],input[type=tel],input[type=password],input[type=number],select{
  width:100%; padding:12px 14px; border-radius:var(--r-sm); border:1.5px solid var(--lav-200);
  background:var(--white); font-family:inherit; font-size:14.5px; color:var(--ink); transition:.15s;
}
input:focus,select:focus{outline:none; border-color:var(--teal); box-shadow:0 0 0 4px rgba(47,143,130,.12);}
.err{color:var(--danger); font-size:12.5px; margin-top:5px; display:none;}
.field.has-err input{border-color:var(--danger);}
.field.has-err .err{display:block;}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.btn{
  width:100%; padding:13px 18px; border-radius:999px; border:none; cursor:pointer;
  font-weight:700; font-size:15px; transition:.15s; display:flex; align-items:center; justify-content:center; gap:8px;
}
.btn-primary{background:linear-gradient(135deg,var(--indigo),var(--indigo-2)); color:#fff; box-shadow:0 8px 20px rgba(46,42,99,.28);}
.btn-primary:hover{transform:translateY(-1px); box-shadow:0 10px 24px rgba(46,42,99,.34);}
.btn-primary:disabled{opacity:.45; cursor:not-allowed; transform:none;}
.btn-ghost{background:transparent; color:var(--indigo-2); border:1.5px solid var(--lav-200);}
.btn-ghost:hover{border-color:var(--gold);}
.btn-danger{background:transparent; color:var(--danger); border:1.5px solid var(--danger);}
.btn-link{background:none;border:none;color:var(--teal);font-weight:700;cursor:pointer;font-size:13.5px;padding:0;}
.foot-link{text-align:center; margin-top:18px; font-size:13.5px; color:var(--ink-60);}
.btn-row{display:flex; gap:10px;}
.btn-row .btn{flex:1;}

/* password */
.pw-wrap{position:relative;}
.pw-wrap input{padding-inline-end:44px;}
.pw-eye{position:absolute; inset-inline-end:6px; top:50%; transform:translateY(-50%); background:none;border:none;cursor:pointer;color:var(--ink-60); width:32px;height:32px;border-radius:50%; display:flex;align-items:center;justify-content:center;}
.pw-eye:hover{color:var(--indigo-2); background:var(--lav-100);}
.pw-strength-track{height:5px;border-radius:999px;background:var(--lav-200);margin-top:9px;overflow:hidden;}
.pw-strength-fill{height:100%;width:0%;border-radius:999px;transition:width .4s cubic-bezier(.3,.8,.3,1), background-color .4s;}
.pw-strength-label{font-size:11.5px;margin-top:5px;font-weight:700;transition:color .3s; min-height:14px;}

/* otp */
.otp-boxes{display:flex; gap:10px; justify-content:center; margin:20px 0;}
.otp-boxes input{width:46px; height:56px; text-align:center; font-size:22px; font-weight:700;}
.otp-boxes.shake{animation:shakeX .5s;}
.otp-boxes.error input{border-color:var(--danger); box-shadow:0 0 0 4px rgba(196,72,63,.18);}
@keyframes shakeX{10%,90%{transform:translateX(-2px);}20%,80%{transform:translateX(4px);}30%,50%,70%{transform:translateX(-8px);}40%,60%{transform:translateX(8px);}}
.otp-hint{background:var(--lav-100); border:1px dashed var(--lav-200); border-radius:var(--r-sm); padding:12px 14px; font-size:13px; color:var(--ink-60); text-align:center; margin-bottom:18px;}
.otp-hint b{color:var(--indigo-2); letter-spacing:2px; font-size:16px;}
.otp-check-row{display:flex; align-items:center; justify-content:center; gap:6px; font-size:12.5px; color:var(--ink-60); min-height:18px; margin-top:4px;}
.otp-check-row.ok{color:var(--ok); font-weight:700;}

/* dashboard */
.stat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:20px 0;}
.stat{background:var(--white); border:1px solid var(--lav-200); border-radius:var(--r-md); padding:16px; text-align:center;}
.stat .num{font-size:22px; font-weight:800; color:var(--indigo-2);}
.stat .lbl{font-size:12px; color:var(--ink-60); margin-top:2px;}
.progress-outer{height:10px; background:var(--lav-200); border-radius:999px; overflow:hidden; margin:8px 0 4px;}
.progress-inner{height:100%; border-radius:999px; background:linear-gradient(90deg,var(--indigo),var(--teal)); transition:width .4s;}
.attempt-row{display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-top:1px solid var(--lav-200); font-size:13.5px;}
.badge{padding:3px 10px; border-radius:999px; font-size:11.5px; font-weight:700;}
.badge.done{background:#E7F6EE; color:var(--ok);}
.badge.progress{background:#FDF3E3; color:#A9781F;}
:root[data-theme="dark"] .badge.done{background:rgba(95,215,155,.14);}
:root[data-theme="dark"] .badge.progress{background:rgba(224,189,126,.14);}

/* test screen */
.thread-wrap{position:relative; height:34px; margin-bottom:22px;}
.thread-wrap svg{width:100%; height:100%; display:block;}
.q-meta{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; font-size:12.5px; color:var(--ink-60); font-weight:600;}
.q-section-tag{color:var(--teal); font-weight:700;}
.q-stem{font-size:13.5px; color:var(--ink-60); margin-bottom:6px;}
.q-title{font-size:20px; font-weight:800; color:var(--indigo-2); margin:0 0 22px; line-height:1.6;}
.opt{
  width:100%; text-align:inherit; background:var(--white); border:1.6px solid var(--lav-200);
  border-radius:var(--r-md); padding:15px 18px; margin-bottom:12px; cursor:pointer; font-size:14.5px;
  display:flex; align-items:center; gap:12px; transition:.15s; font-family:inherit; color:var(--ink);
}
.opt:hover{border-color:var(--gold); background:var(--lav-100);}
.opt .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--lav-200); flex:0 0 auto; transition:.15s; position:relative;}
.opt.selected{border-color:var(--indigo); background:linear-gradient(0deg,rgba(46,42,99,.05),rgba(46,42,99,.05)),var(--white); box-shadow:0 6px 16px rgba(46,42,99,.14);}
.opt.selected .dot{border-color:var(--indigo); background:var(--indigo);}
.opt.selected .dot::after{content:'';position:absolute; inset:5px; border-radius:50%; background:#fff;}
.opt .en{color:var(--ink-60); font-size:12px; font-family:var(--font-en);}
.opt.pulse{animation:optPulse .48s ease-out;}
@keyframes optPulse{0%{box-shadow:0 0 0 0 rgba(46,42,99,.38);}70%{box-shadow:0 0 0 14px rgba(46,42,99,0);}100%{box-shadow:0 0 0 0 rgba(46,42,99,0);}}
.nav-row{display:flex; gap:10px; margin-top:22px;}
.nav-row .btn{width:auto; flex:1;}
.qnav-toggle{display:flex; align-items:center; gap:6px; background:none; border:1px solid var(--lav-200); border-radius:999px; padding:6px 12px; font-size:12px; font-weight:700; color:var(--indigo-2); cursor:pointer; margin-bottom:10px;}
.qnav-toggle:hover{border-color:var(--gold);}
.qnav-panel{background:var(--lav-100); border:1px solid var(--lav-200); border-radius:var(--r-md); padding:14px; margin-bottom:16px;}
.qnav-grid{display:grid; grid-template-columns:repeat(9,1fr); gap:6px;}
.qnav-item{aspect-ratio:1; border-radius:8px; border:1.5px solid var(--lav-200); background:var(--white); font-size:11.5px; font-weight:700; color:var(--ink-60); cursor:pointer; display:flex; align-items:center; justify-content:center;}
.qnav-item.answered{background:var(--indigo); color:#fff; border-color:var(--indigo);}
.qnav-item.current{outline:2px solid var(--gold); outline-offset:1px;}
.qnav-legend{display:flex; gap:14px; margin-top:10px; font-size:11px; color:var(--ink-60);}
.qnav-legend span{display:inline-flex; align-items:center; gap:5px;}
.qnav-legend i{width:10px;height:10px;border-radius:3px; display:inline-block;}

/* users (admin) */
.user-card{background:var(--white); border:1px solid var(--lav-200); border-radius:var(--r-md); margin-bottom:10px; overflow:hidden;}
.user-card-head{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; cursor:pointer; gap:10px;}
.user-card-head:hover{background:var(--lav-100);}
.user-card-head .name{display:flex; align-items:center; gap:10px; font-weight:700; color:var(--indigo-2); font-size:14px;}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--indigo),var(--teal)); color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; flex:0 0 auto;}
.user-card-body{padding:0 16px 16px; border-top:1px solid var(--lav-200);}
.chevron{transition:.2s; color:var(--ink-60); display:flex;}
.chevron.open{transform:rotate(180deg);}

/* section transition / processing */
.center-card{text-align:center;}
.orb{width:96px; height:96px; margin:0 auto 20px; border-radius:50%;
  background:conic-gradient(from 0deg,var(--indigo),var(--teal),var(--gold),var(--rose),var(--indigo));
  animation:spin 3.2s linear infinite; position:relative;}
.orb::after{content:'';position:absolute; inset:8px; border-radius:50%; background:var(--lav-50);}
@keyframes spin{to{transform:rotate(360deg);}}
.check-circle{width:76px;height:76px;border-radius:50%;background:var(--ok); color:#fff; display:flex; align-items:center; justify-content:center; margin:0 auto 18px; animation:popIn .4s cubic-bezier(.3,1.4,.4,1);}
@keyframes popIn{0%{transform:scale(0);opacity:0;}100%{transform:scale(1);opacity:1;}}

/* results */
.result-hero{text-align:center; padding:36px 24px 10px;}
.type-pill{display:inline-block; padding:6px 16px; border-radius:999px; font-size:12.5px; font-weight:700; background:var(--lav-100); color:var(--indigo-2); margin-bottom:10px;}
.type-name{font-size:30px; font-weight:800; color:var(--indigo-2); margin:4px 0;}
.dim-bars{margin:22px 0;}
.dim-row{display:flex; align-items:center; gap:12px; margin-bottom:12px;}
.dim-label{width:92px; font-size:13px; font-weight:700; flex:0 0 auto;}
.dim-track{flex:1; height:12px; background:var(--lav-200); border-radius:999px; overflow:hidden;}
.dim-fill{height:100%; border-radius:999px; transition:width .8s cubic-bezier(.2,.8,.2,1);}
.dim-pct{width:40px; text-align:end; font-size:12.5px; font-weight:700; color:var(--ink-60); flex:0 0 auto;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:20px;}
.info-box{background:var(--white); border:1px solid var(--lav-200); border-radius:var(--r-md); padding:16px;}
.info-box h3{margin:0 0 8px; font-size:13.5px; color:var(--indigo-2); display:flex; gap:6px; align-items:center;}
.info-box ul{margin:0; padding-inline-start:18px; font-size:13px; color:var(--ink-60); line-height:1.9;}
.disclaimer{background:var(--lav-100); border:1px dashed var(--lav-200); border-radius:var(--r-sm); padding:12px 14px; font-size:12px; color:var(--ink-60); margin-top:18px; line-height:1.9;}
.result-actions{display:flex; gap:10px; margin-top:14px;}
.result-actions .btn{flex:1;}

/* intro steps */
.step-list{margin:20px 0;}
.step{display:flex; gap:14px; padding:14px 0; border-top:1px solid var(--lav-200);}
.step:first-child{border-top:none;}
.step .num{width:30px; height:30px; border-radius:50%; background:var(--indigo); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; flex:0 0 auto;}
.step .txt b{display:block; font-size:14px; color:var(--indigo-2); margin-bottom:2px;}
.step .txt span{font-size:12.5px; color:var(--ink-60);}

/* admin */
.admin-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px;}
.table-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}
table{width:100%; border-collapse:collapse; font-size:13px; min-width:520px;}
th,td{padding:10px 8px; text-align:start; border-bottom:1px solid var(--lav-200);}
th{color:var(--ink-60); font-weight:700; font-size:12px;}

.dev-note{position:fixed; bottom:14px; inset-inline:14px; max-width:480px; margin:0 auto; background:var(--indigo-2); color:#fff; font-size:12px; padding:10px 14px; border-radius:var(--r-sm); opacity:.94; z-index:60; display:flex; justify-content:space-between; gap:10px; align-items:center;}
.feature-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
.feature-item{background:var(--white); border:1px solid var(--lav-200); border-radius:var(--r-md); padding:16px; text-align:center;}
.feature-item .emoji{font-size:26px; margin-bottom:6px;}
.feature-item .ft{font-weight:800; font-size:13px; color:var(--indigo-2); margin-bottom:4px;}
.feature-item .fd{font-size:11.5px; color:var(--ink-60); line-height:1.7;}
@media (max-width:640px){ .feature-grid{grid-template-columns:1fr 1fr;} }
.dev-note button{background:none;border:none;color:#fff; opacity:.7; cursor:pointer; font-size:14px;}

/* footer */
.site-footer{text-align:center; padding:10px 16px 26px; font-size:12px; color:var(--ink-60);}
.site-footer .brandlink{color:var(--indigo-2); cursor:pointer; font-weight:700; border:none; background:none; font-size:12px; font-family:inherit; padding:0;}
.site-footer .brandlink:hover{text-decoration:underline;}
.site-footer .adminlink{display:block; margin-top:6px; color:var(--ink-60); background:none; border:none; font-size:11.5px; cursor:pointer; font-family:inherit; text-decoration:underline; opacity:.7;}

/* modal */
.modal-overlay{position:fixed; inset:0; background:rgba(15,13,35,.55); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px; animation:fadeIn .2s;}
@keyframes fadeIn{from{opacity:0} to{opacity:1}}
.modal-box{background:var(--lav-50); border-radius:var(--r-lg); padding:28px; max-width:420px; width:100%; box-shadow:var(--shadow-2); position:relative; border:1px solid var(--lav-200); animation:popIn .25s cubic-bezier(.3,1.2,.4,1);}
.modal-close{position:absolute; top:12px; inset-inline-end:12px; background:none;border:none;font-size:20px;color:var(--ink-60);cursor:pointer; width:30px;height:30px;border-radius:50%;}
.modal-close:hover{background:var(--lav-100);}
.modal-title{font-weight:800; color:var(--indigo-2); font-size:17px; margin:0 0 12px;}
.modal-text{font-size:13.5px; color:var(--ink-60); line-height:2; margin:0;}
.modal-links{display:flex; gap:18px; justify-content:center; margin-top:22px;}
.modal-link{display:flex; flex-direction:column; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-60); text-decoration:none; font-weight:600;}
.modal-link .ic-circle{width:46px;height:46px;border-radius:50%; display:flex;align-items:center;justify-content:center; color:#fff; transition:.15s;}
.modal-link:hover .ic-circle{transform:translateY(-2px); box-shadow:0 6px 14px rgba(0,0,0,.2);}

@media (max-width:520px){
  .row2{grid-template-columns:1fr;} .stat-grid{grid-template-columns:1fr 1fr;} .grid2{grid-template-columns:1fr;}
  .admin-grid{grid-template-columns:1fr 1fr;} .card{padding:22px;} .result-actions{flex-direction:column;}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand" id="brandBtn" style="cursor:pointer"><div class="mark"></div><span id="brandText">خودشناسی</span></div>
  <div class="topbar-actions">
    <button class="icon-btn" id="themeToggle" title="Theme"></button>
    <button class="chip-btn" id="langToggle" onclick="App.toggleLang()">EN</button>
    <button class="chip-btn hidden" id="logoutBtn" onclick="App.logout()">خروج</button>
  </div>
</div>

<main id="main"></main>
<div id="footerHost"></div>
<div id="devNote" class="dev-note hidden"></div>
<div id="modalHost"></div>

<script>
/* =========================================================================
   ICONS — minimal inline SVGs (stroke=currentColor) so they follow theme.

function passwordStrength(pw){
  if(!pw) return {level:0,label:''};
  let score=0;
  if(pw.length>=6) score++;
  if(pw.length>=10) score++;
  if(/[a-zA-Z]/.test(pw) && /[0-9]/.test(pw)) score++;
  if(/[^a-zA-Z0-9]/.test(pw)) score++;
  if(/[a-z]/.test(pw) && /[A-Z]/.test(pw)) score++;
  if(score<=1) return {level:1};
  if(score<=3) return {level:2};
  return {level:3};
}
function filterName(str, lang){
  return lang==='fa' ? str.replace(/[^\u0600-\u06FF\s\u200C]/g,'') : str.replace(/[^A-Za-z\s]/g,'');
}

  el(tag, attrs, children){
    const e = document.createElement(tag);

      else if(k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    (children||[]).forEach(c=> e.appendChild(typeof c==='string'? document.createTextNode(c): c));
    return e;
  },

        const labels = {fa:['','pass_weak','pass_medium','pass_strong'], en:['','pass_weak','pass_medium','pass_strong']};
        const bar = document.getElementById(id+'_bar'); const lbl = document.getElementById(id+'_label');
        bar.style.width = pct+'%'; bar.style.background = colors[level];
        lbl.textContent = level ? this.t(labels[this.lang][level]) : '';
        lbl.style.color = colors[level];
      });
    }
    f.appendChild(this.el('div',{class:'err', id:'err_'+id},[this.t(withStrength?'err_min_pass':'err_pass')]));
    return f;

  async submitRegister(){
    const v = id => document.getElementById(id).value.trim();
    const fname=v('fname'), lname=v('lname'), gender=document.getElementById('gender').value,
      phone=v('phone'), age=v('age'), reglang=document.getElementById('reglang').value, password=v('password');
    const channel = this._regChannel || 'sms';
    const email = v('email');
    const hasEmail = channel==='email' && email.length>0;

    let ok = true;
    ok = this.validate('fname', fname.length>0) && ok;
    ok = this.validate('lname', lname.length>0) && ok;
    // Phone is required only when no email was provided; otherwise optional.
    ok = this.validate('phone', hasEmail ? (phone.length===0 || /^09\d{9}$/.test(phone)) : /^09\d{9}$/.test(phone)) && ok;
    ok = this.validate('age', Number(age)>=12 && Number(age)<=99) && ok;
    ok = this.validate('password', password.length>=6) && ok;
    if(channel==='email'){ ok = this.validate('email', /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) && ok; }
    if(!ok) return;

    this.lang = reglang; this.storSet('lang', reglang); this.applyLang(); this.renderFooter();

    const otp = String(Math.floor(1000+Math.random()*9000));
    this.state.pendingReg = {fname,lname,gender,phone,age,lang:reglang,password,otpChannel:channel,email:channel==='email'?email:''};
    this.state.otpCode = otp; this.state.otpPurpose = 'register';
    this.state.otpChannel = channel;
    this.state.otpDestination = channel==='email' ? email : phone;
    if(channel==='email') console.log('[MockEmailProvider] OTP for', email, '=', otp);
    else console.log('[MockSmsProvider] OTP for', phone, '=', otp);
    this.render('otp');
  },

  /* ---------- OTP (shared: register + forgot password) ---------- */
  screenOtp(){
    const s = this.el('div',{class:'screen'});
    const c = this.el('div',{class:'card'});
    const purpose = this.state.otpPurpose;
    const phone = purpose==='forgot' ? this.state.otpDestination : this.state.otpDestination;
    c.appendChild(this.el('h1',{},[this.t('otp_title')]));
    c.appendChild(this.el('p',{class:'sub'},[this.t('otp_sub',{phone})]));

    const hint = this.el('div',{class:'otp-hint'});
    hint.innerHTML = `${this.t('dev_mode')} <b>${this.state.otpCode}</b>`;
    c.appendChild(hint);

    const boxes = this.el('div',{class:'otp-boxes', dir:'ltr'});
    const statusRow = this.el('div',{class:'otp-check-row'});
    const inputs = [];
    for(let i=0;i<4;i++){
      const inp = this.el('input',{type:'text', maxlength:'1', inputmode:'numeric'});
      inputs.push(inp); boxes.appendChild(inp);
    }
    const checkNow = ()=>{
      const code = inputs.map(i=>i.value).join('');
      if(code.length<4){ statusRow.textContent=''; statusRow.classList.remove('ok'); return; }
      if(code === this.state.otpCode){
        statusRow.textContent = this.t('otp_ok'); statusRow.classList.add('ok');
        inputs.forEach(i=>i.disabled = true);
        setTimeout(()=>{
          if(purpose==='forgot') this.render('forgotReset'); else this.completeRegistration();
        }, 350);
      } else {
        statusRow.textContent = this.t('otp_checking'); statusRow.classList.remove('ok');
        boxes.classList.add('shake','error');
        setTimeout(()=>{
          boxes.classList.remove('shake','error');
          inputs.forEach(i=>i.value='');
          statusRow.textContent = '';
          inputs[0].focus();
        }, 550);
      }
    };
    inputs.forEach((inp,i)=>{
      inp.addEventListener('input', (e)=>{
        if(e.target.value && inputs[i+1]) inputs[i+1].focus();
        checkNow();
      });
      inp.addEventListener('keydown', (e)=>{ if(e.key==='Backspace' && !e.target.value && inputs[i-1]) inputs[i-1].focus(); });
    });
    c.appendChild(boxes);
    c.appendChild(statusRow);

    c.appendChild(this.el('div',{class:'foot-link'},[
      this.el('button',{class:'btn-link', onclick:()=>{
        this.state.otpCode = String(Math.floor(1000+Math.random()*9000));
        if(this.state.otpChannel==='email') console.log('[MockEmailProvider] OTP resent:', this.state.otpCode);
        else console.log('[MockSmsProvider] OTP resent:', this.state.otpCode);
        this.render('otp');
      }},[this.t('otp_resend')])
    ]));
    s.appendChild(c);
    setTimeout(()=>inputs[0] && inputs[0].focus(), 50);
    return s;
  },

  /* ---------- QUESTION ---------- */
  screenQuestion(){
    const idx = this.state.qIndex;
    const q = QUESTIONS[idx];
    const s = this.el('div',{class:'screen'});
    const c = this.el('div',{class:'card'});

    const svgNS = 'http://www.w3.org/2000/svg';
    const wrap = this.el('div',{class:'thread-wrap'});
    const svg = document.createElementNS(svgNS,'svg'); svg.setAttribute('viewBox','0 0 400 34'); svg.setAttribute('preserveAspectRatio','none');
    ['R','B','Y','W'].forEach((k,i)=>{
      const y = 6 + i*7;
      const bg = document.createElementNS(svgNS,'line');
      bg.setAttribute('x1','0'); bg.setAttribute('x2','400'); bg.setAttribute('y1',y); bg.setAttribute('y2',y);
      bg.style.stroke='var(--lav-200)'; bg.setAttribute('stroke-width','3'); bg.setAttribute('stroke-linecap','round');
      svg.appendChild(bg);
      const fg = document.createElementNS(svgNS,'line');
      const pct = idx/45;
      fg.setAttribute('x1','0'); fg.setAttribute('x2', String(400*pct)); fg.setAttribute('y1',y); fg.setAttribute('y2',y);
      fg.style.stroke=`var(${DIMENSIONS[k].cssVar})`; fg.setAttribute('stroke-width','3'); fg.setAttribute('stroke-linecap','round');
      svg.appendChild(fg);
    });
    wrap.appendChild(svg); c.appendChild(wrap);

    const meta = this.el('div',{class:'q-meta'});
    meta.appendChild(this.el('span',{class:'q-section-tag'},[q.section===1?this.t('section1_tag'):this.t('section2_tag')]));
    meta.appendChild(this.el('span',{},[this.t('q_of',{n:idx+1})]));
    c.appendChild(meta);

    const answers = this.state.currentAttempt.answers;
    const toggleBtn = this.el('button',{class:'qnav-toggle', onclick:()=>{ this.state.navOpen = !this.state.navOpen; this.render('question'); }},[
      this.t('qlist')+' '+(this.state.navOpen? '▲':'▼')
    ]);
    c.appendChild(toggleBtn);
    if(this.state.navOpen){
      const panel = this.el('div',{class:'qnav-panel'});
      const grid = this.el('div',{class:'qnav-grid'});
      QUESTIONS.forEach((qq,qi)=>{
        const isAnswered = answers[qq.id] !== undefined;
        const cls = 'qnav-item'+(isAnswered?' answered':'')+(qi===idx?' current':'');
        grid.appendChild(this.el('button',{class:cls, onclick:()=>{ this.state.navOpen=false; this.gotoQuestion(qi); }},[String(qi+1)]));
      });
      panel.appendChild(grid);
      panel.appendChild(this.el('div',{class:'qnav-legend'},[
        this.el('span',{},[this.el('i',{style:'background:var(--indigo)'}), this.t('qlist_answered')]),
        this.el('span',{},[this.el('i',{style:'background:var(--white);border:1px solid var(--lav-200)'}), this.t('qlist_unanswered')]),
      ]));
      c.appendChild(panel);
    }

    if(q.stem) c.appendChild(this.el('div',{class:'q-stem'},[this.lang==='fa'?q.stem[0]:q.stem[1]]));
    c.appendChild(this.el('div',{class:'q-title'},[
      q.section===1 ? (this.lang==='fa'?'کدام کلمه به شما نزدیک‌تر است؟':'Which word feels closest to you?')
                    : (this.lang==='fa'?'کدام گزینه به رفتار طبیعی شما نزدیک‌تر است؟':'Which option is closest to your natural behavior?')
    ]));

    const selected = answers[q.id];
    q.opts.forEach((opt,oi)=>{
      const [fa,en] = opt;
      const cls = 'opt'+(selected===oi?' selected':'')+(this.state.pulseOption===oi?' pulse':'');
      const btn = this.el('button',{class:cls},[
        this.el('span',{class:'dot'}),
        this.el('span',{},[ this.lang==='fa'? fa : en, ...(this.lang==='fa'? [this.el('span',{class:'en'},[' ('+en+')'])]:[]) ])
      ]);
      btn.addEventListener('click', ()=> this.selectOption(q.id, oi));
      c.appendChild(btn);
    });

    const nav = this.el('div',{class:'nav-row'});
    if(idx>0) nav.appendChild(this.el('button',{class:'btn btn-ghost', onclick:()=>this.gotoQuestion(idx-1)},[this.t('back')]));
    if(nav.children.length) c.appendChild(nav);
    s.appendChild(c); return s;
  },

  selectOption(qId, optIndex){
    const attempt = this.state.currentAttempt;
    attempt.answers[qId] = optIndex;
    this.storSet('attempt', attempt);
    this.state.pulseOption = optIndex;
    this.render('question');
    setTimeout(()=>{
      this.state.pulseOption = null;
      if(this.state.qIndex === 29){ this.render('sectionTransition'); }
      else if(this.state.qIndex === 44){ this.finishTest(); }
      else { this.state.qIndex++; this.render('question'); }
    }, 480);
  },
  gotoQuestion(i){ this.state.qIndex = i; this.render('question'); },

  screenSectionTransition(){
    const s = this.el('div',{class:'screen'});
    const c = this.el('div',{class:'card center-card'});
    c.appendChild(this.el('div',{class:'orb'}));
    c.appendChild(this.el('h1',{},[this.t('sec_trans_title')]));
    c.appendChild(this.el('p',{class:'sub'},[this.t('sec_trans_sub')]));
    c.appendChild(this.el('button',{class:'btn btn-primary', onclick:()=>{ this.state.qIndex=30; this.render('question'); }},[this.t('sec_trans_btn')]));
    s.appendChild(c); return s;
  },

  async finishTest(){
    this.render('processing');
    const attempt = this.state.currentAttempt;
    await new Promise(r=>setTimeout(r, 1400));
    const result = this.calculatePersonalityResult(attempt);
    attempt.status = 'COMPLETED'; attempt.result = result; attempt.date = Date.now();
    await this.storDelete('attempt').catch(()=>{});
    const attempts = await this.storGet('attempts') || [];
    attempts.push({ id:attempt.id, date:attempt.date, status:'COMPLETED', primary:result.primary, secondary:result.secondary, scores:result.percentages, answers:attempt.answers });
    await this.storSet('attempts', attempts);
    this.render('result', attempts[attempts.length-1]);
  },

  screenProcessing(){
    const s = this.el('div',{class:'screen'});
    const c = this.el('div',{class:'card center-card'});
    c.appendChild(this.el('div',{class:'orb'}));
    c.appendChild(this.el('h1',{},[this.t('processing_title')]));
    c.appendChild(this.el('p',{class:'sub'},[this.t('processing_sub')]));
    s.appendChild(c); return s;
  },

  /* ---------- SCORING ENGINE ----------
     calculatePersonalityResult(attempt): independent, testable service.
     1. reads answers -> 2. maps each chosen option to its color/dimension via
     QUESTIONS config -> 3. sums raw scores per dimension -> 4. converts to
     percentages -> 5. determines primary/secondary -> 6. returns summary.
     Ties: if two dimensions are close (within 2 raw points) both are
     reported as primary/secondary. */
  calculatePersonalityResult(attempt){
    const raw = {R:0,B:0,Y:0,W:0};
    QUESTIONS.forEach(q=>{
      const ans = attempt.answers[q.id];
      if(ans===undefined) return;
      raw[q.opts[ans][2]]++;
    });
    const total = Object.values(raw).reduce((a,b)=>a+b,0) || 1;
    const percentages = {};
    Object.keys(raw).forEach(k=> percentages[k] = Math.round((raw[k]/total)*100));
    const order = ['R','B','Y','W'];
    const sorted = order.slice().sort((a,b)=> raw[b]-raw[a]);
    return { raw, percentages, primary:sorted[0], secondary:sorted[1], scoringVersion:'v1-heuristic-colorcode' };
  },

  /* ---------- RESULT ---------- */
  screenResult(data){
    const s = this.el('div',{class:'screen'});
    const c = this.el('div',{class:'card', id:'resultCard'});
    const hero = this.el('div',{class:'result-hero'});
    hero.appendChild(this.el('div',{class:'type-pill'},[this.t('result_ready')]));
    hero.appendChild(this.el('div',{class:'type-name'},[TYPE_INFO[data.primary].name[this.lang]]));
    hero.appendChild(this.el('p',{class:'sub', style:'margin:10px 0 0'},[TYPE_INFO[data.primary].desc[this.lang]]));
    c.appendChild(hero);

    const bars = this.el('div',{class:'dim-bars'});
    ['R','B','Y','W'].forEach(k=>{
      const pct = data.scores[k];
      bars.appendChild(this.el('div',{class:'dim-row'},[
        this.el('span',{class:'dim-label', style:`color:var(${DIMENSIONS[k].cssVar})`},[DIMENSIONS[k][this.lang]]),
        this.el('div',{class:'dim-track'},[this.el('div',{class:'dim-fill', style:`width:${pct}%;background:var(${DIMENSIONS[k].cssVar})`})]),
        this.el('span',{class:'dim-pct'},[pct+'%'])
      ]));
    });
    c.appendChild(bars);

    if(data.secondary && data.secondary!==data.primary){
      c.appendChild(this.el('p',{class:'sub'},[`${this.t('result_secondary')}: ${TYPE_INFO[data.secondary].name[this.lang]}`]));
    }

    const grid = this.el('div',{class:'grid2'});
    const mkBox = (titleKey, items)=>{
      const b = this.el('div',{class:'info-box'});
      b.appendChild(this.el('h3',{},[this.t(titleKey)]));
      const ul = this.el('ul',{});
      items.forEach(it=> ul.appendChild(this.el('li',{},[it])));
      b.appendChild(ul); return b;
    };
    grid.appendChild(mkBox('strengths', TYPE_INFO[data.primary].strengths[this.lang]));
    grid.appendChild(mkBox('challenges', TYPE_INFO[data.primary].challenges[this.lang]));
    c.appendChild(grid);

    const grid2 = this.el('div',{class:'grid2'});
    grid2.appendChild(mkBox('work', [TYPE_INFO[data.primary].work[this.lang]]));
    grid2.appendChild(mkBox('comm', [TYPE_INFO[data.primary].comm[this.lang]]));
    c.appendChild(grid2);

    c.appendChild(this.el('div',{class:'disclaimer'},[this.t('disclaimer')]));

    const actions = this.el('div',{class:'result-actions'});
    const dlBtn = this.el('button',{class:'btn btn-ghost', html:ICON.download+' <span>'+this.t('download_pdf')+'</span>'});
    dlBtn.addEventListener('click', ()=>this.downloadResultPDF(data));
    const shBtn = this.el('button',{class:'btn btn-ghost', html:ICON.share+' <span>'+this.t('share_result')+'</span>'});
    shBtn.addEventListener('click', ()=>this.shareResultImage());
    actions.appendChild(dlBtn); actions.appendChild(shBtn);
    c.appendChild(actions);

    c.appendChild(this.el('button',{class:'btn btn-primary', style:'margin-top:14px', onclick:()=>this.render('dashboard')},[this.t('back_dash')]));
    c.appendChild(this.el('button',{class:'btn btn-ghost', style:'margin-top:10px', onclick:()=>this.render('testIntro')},[this.t('retake')]));
    s.appendChild(c); return s;
  },

  /* Note: jsPDF's built-in fonts don't support Persian glyphs, so the PDF
     export uses English labels regardless of UI language to avoid garbled text. */
  downloadResultPDF(data){
    if(!window.jspdf){ alert(this.lang==='fa'?'کتابخانه PDF بارگذاری نشد. اتصال اینترنت را بررسی کنید.':'PDF library failed to load. Check your internet connection.'); return; }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.setFillColor(46,42,99); doc.rect(0,0,210,32,'F');
    doc.setTextColor(255,255,255); doc.setFontSize(20); doc.setFont('helvetica','bold');
    doc.text('Self Insight — Personality Result', 15, 18);
    doc.setFontSize(11); doc.setFont('helvetica','normal');
    doc.text(new Date(data.date).toLocaleDateString('en-US'), 15, 26);

    doc.setTextColor(30,30,50); doc.setFontSize(16); doc.setFont('helvetica','bold');
    doc.text('Primary type: ' + TYPE_INFO[data.primary].name.en, 15, 46);
    if(data.secondary && data.secondary!==data.primary){
      doc.setFontSize(11); doc.setFont('helvetica','normal');
      doc.text('Secondary type: ' + TYPE_INFO[data.secondary].name.en, 15, 54);
    }
    doc.setFontSize(10.5); doc.setTextColor(90,90,110);
    const descLines = doc.splitTextToSize(TYPE_INFO[data.primary].desc.en, 180);
    doc.text(descLines, 15, 64);

    let y = 64 + descLines.length*5 + 10;
    doc.setFontSize(12); doc.setTextColor(30,30,50); doc.setFont('helvetica','bold');
    doc.text('Dimension breakdown', 15, y); y += 8;
    const dimColors = {R:[196,72,63],B:[46,42,99],Y:[201,161,94],W:[47,143,130]};
    ['R','B','Y','W'].forEach(k=>{
      doc.setFontSize(10); doc.setFont('helvetica','normal'); doc.setTextColor(60,60,80);
      doc.text(DIMENSIONS[k].en, 15, y+4);
      doc.setFillColor(228,224,246); doc.roundedRect(65, y, 100, 5, 2, 2, 'F');
      const c = dimColors[k];
      doc.setFillColor(c[0],c[1],c[2]);
      doc.roundedRect(65, y, Math.max(2,data.scores[k]), 5, 2, 2, 'F');
      doc.text(data.scores[k]+'%', 170, y+4);
      y += 11;
    });

    y += 6;
    doc.setFontSize(9.5); doc.setTextColor(120,120,140);
    const disc = doc.splitTextToSize('This is a self-insight tool, not a substitute for psychological or medical diagnosis.', 180);
    doc.text(disc, 15, y);
    doc.text('Designed & developed by Ranova team — 2026', 15, 285);
    doc.save('personality-result.pdf');
  },

  shareResultImage(){
    if(!window.html2canvas){ alert(this.lang==='fa'?'کتابخانه تصویرسازی بارگذاری نشد. اتصال اینترنت را بررسی کنید.':'Image library failed to load. Check your internet connection.'); return; }
    const node = document.getElementById('resultCard');
    html2canvas(node, {backgroundColor:this.theme==='dark'?'#161A3E':'#ffffff', scale:2}).then(canvas=>{
      canvas.toBlob(blob=>{
        const file = new File([blob], 'personality-result.png', {type:'image/png'});
        if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
          navigator.share({files:[file], title:'Personality Result'}).catch(()=>{});
        } else {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a'); a.href=url; a.download='personality-result.png'; document.body.appendChild(a); a.click(); a.remove();
          URL.revokeObjectURL(url);
          this.showDevNote(this.t('share_fallback'));
        }
      });
    });
  },

  /* ---------- ADMIN LOGIN (separate identity from regular users) ---------- */
  screenAdminLogin(){
    const s = this.el('div',{class:'screen'});
    const c = this.el('div',{class:'card center-card'});
    c.appendChild(this.el('div',{style:'width:56px;height:56px;border-radius:16px;background:var(--lav-100);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:var(--indigo-2)', html:ICON.shield}));
    c.appendChild(this.el('h1',{},[this.t('admin_login_title')]));
    c.appendChild(this.el('p',{class:'sub'},[this.t('admin_login_sub')]));
    const f1 = this.el('div',{class:'field', id:'f_ausername', style:'text-align:start'});
    f1.appendChild(this.el('label',{},[this.t('admin_username')]));
    f1.appendChild(this.el('input',{type:'text', id:'ausername'}));
    f1.appendChild(this.el('div',{class:'err', id:'err_ausername'},[this.t('admin_err')]));
    c.appendChild(f1);
    const pf = this.mkPasswordField('apass','password', false);
    pf.style.textAlign = 'start';
    c.appendChild(pf);
    c.appendChild(this.el('div',{class:'otp-hint'},[this.t('admin_dev_hint')]));
    const btn = this.el('button',{class:'btn btn-primary'},[this.t('admin_login_btn')]);
    btn.addEventListener('click', async ()=>{
      const acc = await this.storGet('adminAccount');
      const u = document.getElementById('ausername').value.trim();
      const p = document.getElementById('apass').value.trim();
      if(acc && acc.username===u && acc.password===p){
        this.validate('ausername', true); this.validate('apass', true);
        this.state.isAdmin = true;
        this.render('admin');
      } else {
        this.validate('ausername', false); this.validate('apass', false);
      }
    });
    c.appendChild(btn);
    c.appendChild(this.el('button',{class:'btn btn-ghost', style:'margin-top:10px', onclick:()=>this.render('welcome')},[this.lang==='fa'?'بازگشت':'Back']));
    s.appendChild(c); return s;
  },

  /* ---------- ADMIN PANEL ---------- */
  async screenAdmin(){
    const user = await this.storGet('user');
    const attempts = await this.storGet('attempts') || [];
    const inProgressAttempt = await this.storGet('attempt');
    const hasInProgress = inProgressAttempt && inProgressAttempt.status === 'IN_PROGRESS';
    const s = this.el('div',{class:'screen wide'});
    const c = this.el('div',{class:'card'});
    const headRow = this.el('div',{style:'display:flex;justify-content:space-between;align-items:flex-start;gap:12px'},[
      this.el('div',{},[this.el('h1',{},[this.t('admin_title')]), this.el('p',{class:'sub'},[this.t('admin_sub')])]),
      this.el('button',{class:'btn-link', onclick:()=>{ this.state.isAdmin=false; this.render('welcome'); }},[this.t('admin_logout')])
    ]);
    c.appendChild(headRow);

    const done = attempts.filter(a=>a.status==='COMPLETED');
    const totalAttempts = attempts.length + (hasInProgress?1:0);
    const grid = this.el('div',{class:'admin-grid'});
    grid.appendChild(this.el('div',{class:'stat'},[this.el('div',{class:'num'},[user?'1':'0']), this.el('div',{class:'lbl'},[this.t('admin_users')])]));
    grid.appendChild(this.el('div',{class:'stat'},[this.el('div',{class:'num'},[String(totalAttempts)]), this.el('div',{class:'lbl'},[this.t('admin_attempts')])]));
    grid.appendChild(this.el('div',{class:'stat'},[this.el('div',{class:'num'},[String(done.length)]), this.el('div',{class:'lbl'},[this.t('admin_completed')])]));
    grid.appendChild(this.el('div',{class:'stat'},[this.el('div',{class:'num'},[String(hasInProgress?1:0)]), this.el('div',{class:'lbl'},[this.t('admin_inprog')])]));
    c.appendChild(grid);

    c.appendChild(this.el('h2',{html:ICON.users},[this.t('admin_users')]));
    const usersToggle = this.el('button',{class:'chip-btn'+(this.state.adminUsersOpen?' active':''), style:'margin-bottom:14px'},[
      this.state.adminUsersOpen ? this.t('admin_hide_users') : this.t('admin_show_users')
    ]);
    usersToggle.addEventListener('click', ()=>{ this.state.adminUsersOpen = !this.state.adminUsersOpen; this.render('admin'); });
    c.appendChild(usersToggle);

    if(this.state.adminUsersOpen){
      const usersList = user ? [user] : [];
      if(!usersList.length){
        c.appendChild(this.el('p',{class:'sub'},[this.t('no_history')]));
      } else {
        usersList.forEach((u, ui)=>{
          const isOpen = this.state.adminExpandedUser === ui;
          const card = this.el('div',{class:'user-card'});
          const head = this.el('div',{class:'user-card-head'},[
            this.el('div',{class:'name'},[ this.el('span',{class:'avatar'},[u.fname.charAt(0)]), u.name ]),
          ]);
          const nameBtn = head.firstChild;
          nameBtn.style.cursor = 'pointer';
          nameBtn.addEventListener('click', ()=>{ this.state.adminExpandedUser = isOpen ? null : ui; this.render('admin'); });
          const actionsWrap = this.el('div',{style:'display:flex;align-items:center;gap:8px'});
          const delUserBtn = this.el('button',{class:'btn-link', style:'color:var(--danger);font-size:12px'},[this.lang==='fa'?'حذف کاربر':'Delete user']);
          delUserBtn.addEventListener('click', async (e)=>{
            e.stopPropagation();
            const msg = this.lang==='fa' ? `کاربر «${u.name}» و همهٔ تست‌های او برای همیشه حذف شود؟` : `Permanently delete user "${u.name}" and all their tests?`;
            if(!confirm(msg)) return;
            await this.storDelete('user'); await this.storDelete('attempts'); await this.storDelete('attempt');
            this.state.adminExpandedUser = null;
            this.render('admin');
          });
          const chevron = this.el('span',{class:'chevron'+(isOpen?' open':''), html:'<svg class="ic" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>', style:'cursor:pointer'});
          chevron.addEventListener('click', ()=>{ this.state.adminExpandedUser = isOpen ? null : ui; this.render('admin'); });
          actionsWrap.appendChild(delUserBtn); actionsWrap.appendChild(chevron);
          head.appendChild(actionsWrap);
          card.appendChild(head);
          if(isOpen){
            const body = this.el('div',{class:'user-card-body'});
            const uRow = (labelKey, val)=> this.el('div',{style:'display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--lav-200);font-size:13px'},[
              this.el('span',{style:'color:var(--ink-60)'},[this.t(labelKey)]), this.el('span',{style:'font-weight:600'},[String(val)])
            ]);
            if(u.phone) body.appendChild(uRow('phone', u.phone));
            if(u.email) body.appendChild(uRow('email', u.email));
            body.appendChild(uRow('age', u.age));
            body.appendChild(uRow('gender', u.gender==='male'?this.t('male'):this.t('female')));
            body.appendChild(uRow('lang', u.lang==='fa'?'فارسی':'English'));

            body.appendChild(this.el('h3',{style:'margin:16px 0 8px;font-size:13px;color:var(--indigo-2)'},[this.t('admin_table_title')]));
            if(!attempts.length && !hasInProgress){
              body.appendChild(this.el('p',{class:'sub', style:'margin:0'},[this.t('no_history')]));
            } else {
              const tableScroll = this.el('div',{class:'table-scroll'});
              const table = this.el('table',{});
              table.appendChild(this.el('tr',{},[
                this.el('th',{},[this.t('col_date')]), this.el('th',{},[this.t('col_status')]), this.el('th',{},[this.t('col_type')]),
                this.el('th',{},['R']), this.el('th',{},['B']), this.el('th',{},['Y']), this.el('th',{},['W']), this.el('th',{},['#']), this.el('th',{},[''])
              ]));
              const mkDeleteBtn = (onClick)=>{
                const b = this.el('button',{style:'color:var(--danger);background:none;border:none;cursor:pointer;font-size:14px'},['🗑']);
                b.addEventListener('click', onClick);
                return b;
              };
              if(hasInProgress){
                table.appendChild(this.el('tr',{},[
                  this.el('td',{},[new Date(inProgressAttempt.startedAt).toLocaleString(this.lang==='fa'?'fa-IR':'en-US')]),
                  this.el('td',{},['IN_PROGRESS']),
                  this.el('td',{},['—']), this.el('td',{},['—']), this.el('td',{},['—']), this.el('td',{},['—']), this.el('td',{},['—']),
                  this.el('td',{},[String(Object.keys(inProgressAttempt.answers||{}).length)+'/45']),
                  this.el('td',{},[mkDeleteBtn(async ()=>{
                    const msg = this.lang==='fa' ? 'این تست ناتمام برای همیشه حذف شود؟' : 'Permanently delete this unfinished test?';
                    if(!confirm(msg)) return;
                    await this.storDelete('attempt');
                    this.render('admin');
                  })])
                ]));
              }
              attempts.slice().reverse().forEach(a=>{
                const sc = a.scores || {};
                table.appendChild(this.el('tr',{},[
                  this.el('td',{},[new Date(a.date).toLocaleString(this.lang==='fa'?'fa-IR':'en-US')]),
                  this.el('td',{},[a.status]),
                  this.el('td',{},[a.primary?TYPE_INFO[a.primary].name[this.lang]:'—']),
                  this.el('td',{},[sc.R!==undefined? sc.R+'%':'—']),
                  this.el('td',{},[sc.B!==undefined? sc.B+'%':'—']),
                  this.el('td',{},[sc.Y!==undefined? sc.Y+'%':'—']),
                  this.el('td',{},[sc.W!==undefined? sc.W+'%':'—']),
                  this.el('td',{},[String(Object.keys(a.answers||{}).length)+'/45']),
                  this.el('td',{},[mkDeleteBtn(async ()=>{
                    const msg = this.lang==='fa' ? 'نتیجهٔ این تست برای همیشه حذف شود؟' : 'Permanently delete this test result?';
                    if(!confirm(msg)) return;
                    const updated = attempts.filter(x=>x.id!==a.id);
                    await this.storSet('attempts', updated);
                    this.render('admin');
                  })])
                ]));
              });
              tableScroll.appendChild(table);
              body.appendChild(tableScroll);
            }
            card.appendChild(body);
          }
          c.appendChild(card);
        });
      }
    }
    c.appendChild(this.el('button',{class:'btn btn-ghost', style:'margin-top:18px', onclick:()=>this.render('welcome')},[this.lang==='fa'?'بازگشت به سایت':'Back to site']));
    s.appendChild(c); return s;
  }
};

App.init();
</script>
